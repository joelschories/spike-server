# Spike läuft hier nur als Container auf deinem Raspberry. Es erscheint nicht in
# Home Assistant und greift nicht darauf zu – Home Assistant dient nur als Installationsweg.
name: Spike
version: "0.7.0"
slug: spike
description: Spike-Server für die Spike-App (Heimnetz-Sicherheit). Läuft unabhängig von Home Assistant.
url: https://github.com/joelschories/spike-server
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
environment:
  SPIKE_MODE: addon
options:
  reset_pairing: false
schema:
  reset_pairing: bool
