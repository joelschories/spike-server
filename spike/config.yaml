name: Spike
version: "0.1.0"
slug: spike
description: Heimnetz-Sicherheit für deine FRITZ!Box – Geräte-Wächter, Sicherheits-Checks und Gast-WLAN für die Spike-App.
url: https://github.com/spikeshield/spike-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# Spike muss das Heimnetz sehen (Router erreichen, sich per Bonjour melden)
host_network: true
ingress: true
ingress_port: 8765
panel_icon: mdi:shield-check
panel_title: Spike
options:
  fritz_host: "192.168.178.1"
  fritz_user: ""
  fritz_password: ""
schema:
  fritz_host: str
  fritz_user: str?
  fritz_password: password?
