# Baut bei jeder Änderung das Docker-Image für Raspberry Pi (arm64) und PCs (amd64)
# und veröffentlicht es unter ghcr.io/joelschories/spike-server.
name: Docker-Image

on:
  push:
    branches: [main]
    paths: ["spike/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version lesen
        id: version
        run: echo "version=$(grep -oP '^version:\s*"\K[^"]+' spike/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: spike
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/joelschories/spike-server:latest
            ghcr.io/joelschories/spike-server:${{ steps.version.outputs.version }}
